<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXUS — Chat</title>
<style>
  :root{
    --bg:#fcfbf8;
    --text:#1a1a1a;
    --border:#e8e3da;
    --input-bg:#ffffff;
    --bubble-user-bg:#1a1a1a;
    --bubble-user-text:#fcfbf8;
    --bubble-pion-bg:#f0ede8;
    --bubble-pion-text:#1a1a1a;
    --accent:#c9a86a;
  }
  html[data-theme="dark"]{
    --bg:#0f0f0e;
    --text:#e8e3da;
    --border:#2a2724;
    --input-bg:#1e1c19;
    --bubble-user-bg:#c9a86a;
    --bubble-user-text:#0f0f0e;
    --bubble-pion-bg:#1e1c19;
    --bubble-pion-text:#e8e3da;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family: ui-sans-system, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  header{
    height:56px;
    min-height:56px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid var(--border);
    background:var(--bg);
    position:sticky;
    top:0;
    z-index:10;
  }
  header .title{
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:600;
  }
  /* toggle */
  #theme-toggle{
    border:0;
    background:transparent;
    cursor:pointer;
    padding:4px;
  }
  #theme-toggle .track{
    width:44px;
    height:24px;
    border-radius:12px;
    background:var(--border);
    display:block;
    position:relative;
    transition:background .2s;
  }
  #theme-toggle .dot{
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--accent);
    position:absolute;
    top:3px;
    left:3px;
    transition:transform .22s cubic-bezier(.4,0,.2,1);
    display:grid;
    place-items:center;
  }
  html[data-theme="dark"] #theme-toggle .dot{ transform:translateX(20px); }
  /* pure CSS sun/moon inside dot */
  .dot::after{
    content:"";
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--bg);
    box-shadow: 0 0 0 1px var(--bg);
    display:block;
  }
  html[data-theme="dark"] .dot::after{
    background:transparent;
    width:8px;
    height:8px;
    box-shadow: -2px -1px 0 0 var(--bg);
    transform:translate(1px,0);
    border-radius:50%;
  }
  #messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .bubble{
    max-width:78%;
    padding:12px 14px;
    border-radius:14px;
    line-height:1.4;
    font-size:14.5px;
    word-wrap:break-word;
    white-space:pre-wrap;
  }
  .bubble.user{
    align-self:flex-end;
    background:var(--bubble-user-bg);
    color:var(--bubble-user-text);
    border-bottom-right-radius:6px;
  }
  .bubble.pion{
    align-self:flex-start;
    background:var(--bubble-pion-bg);
    color:var(--bubble-pion-text);
    border-bottom-left-radius:6px;
    border:1px solid var(--border);
  }
  .pion-meta{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    opacity:0.6;
    margin-bottom:6px;
    font-weight:600;
  }
  #bar{
    height:68px;
    min-height:68px;
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 20px;
    background:var(--bg);
  }
  #search-bar{
    flex:1;
    height:44px;
    border-radius:22px;
    border:1px solid var(--border);
    background:var(--input-bg);
    color:var(--text);
    padding:0 18px;
    font-size:14px;
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  #search-bar:focus{
    outline:2px solid var(--accent);
    outline-offset:0;
    border-color:var(--accent);
  }
  #send{
    width:44px;
    height:44px;
    border-radius:50%;
    border:0;
    background:var(--bubble-user-bg);
    color:var(--bg);
    cursor:pointer;
    display:grid;
    place-items:center;
    flex-shrink:0;
    transition:background .15s, transform .1s;
  }
  #send:hover{ background:var(--accent); }
  #send:active{ transform:scale(.96); }
  /* arrow pure CSS */
  #send i{
    display:block;
    width:0;
    height:0;
    border-left:6px solid currentColor;
    border-top:5px solid transparent;
    border-bottom:5px solid transparent;
    transform:translateX(1px);
    position:relative;
  }
  #send i::before{
    content:"";
    position:absolute;
    left:-12px;
    top:-1px;
    width:8px;
    height:2px;
    background:currentColor;
  }
</style>
</head>
<body>
<header>
  <div class="title">NEXUS</div>
  <button id="theme-toggle" aria-label="Changer thème">
    <span class="track"><span class="dot"></span></span>
  </button>
</header>

<div id="messages"></div>

<div id="bar">
  <input id="search-bar" type="text" placeholder="Écris un message…" autocomplete="off" />
  <button id="send" aria-label="Envoyer"><i></i></button>
</div>

<script type="module">
  import { parse } from './nexus.js';

  const REGISTRE = {
    weather: './pions/weather.js',
    itinerary: './pions/itinerary.js',
    hotels: './pions/hotels.js',
    generic: './pions/generic.js'
  };

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('search-bar');
  const sendEl = document.getElementById('send');
  const toggleEl = document.getElementById('theme-toggle');

  // theme
  const saved = localStorage.getItem('nexus-theme');
  if(saved) document.documentElement.dataset.theme = saved;

    localStorage.setItem('nexus-theme', next);
  });

      const meta = document.createElement('div');
      meta.className = 'pion-meta';
      meta.textContent = pion;
      div.appendChild(meta);

    span.textContent = text;
    div.appendChild(span);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

    const text = inputEl.value.trim();
    if(!text) return;
    addBubble({role:'user', text});
    inputEl.value = '';

    let plan = [];
    try{
      plan = parse({text, now: new Date()});
    }catch(e){
      // fallback mock parse si nexus.js absent en preview
      const lower = text.toLowerCase();
      if(lower.includes('météo') || lower.includes('weather')) plan = [{pion:'weather', params:{q:text}}];
      else if(lower.includes('hôtel') || lower.includes('hotel')) plan = [{pion:'hotels', params:{q:text}}];
      else if(lower.includes('itinéraire') || lower.includes('trajet')) plan = [{pion:'itinerary', params:{q:text}}];
      else plan = [{pion:'generic', params:{q:text}}];
    }

    for(const task of plan){
      try{
        const path = REGISTRE[task.pion] || REGISTRE.generic;
        const mod = await import(path);
        const result = await mod.execute(task.params);
        addBubble({role:'pion', text: result.text, pion: task.pion});
      }catch(err){
        // preview mock
        const mocks = {
          weather: 'Météo — 18° à Paris, éclaircies. Vent léger.',
          itinerary: 'Itinéraire — 14 min à pied via Rue de Rivoli.',
          hotels: 'Hôtels — 3 options près de toi : Le Petit, Hôtel Lumen, Casa.',
          generic: 'NEXUS — J\\'ai bien reçu : "' + text + '". (mock preview)'
        };
        addBubble({role:'pion', text: mocks[task.pion] || mocks.generic, pion: task.pion});
      }
    }
  }

  sendEl.addEventListener('click', handleSend);
  inputEl.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') handleSend();
  });

  // message d'accueil
  addBubble({role:'pion', text:'NEXUS prêt. Parle-moi de météo, itinéraire ou hôtels.', pion:'système'});
