<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXUS</title>
<style>
  /* ===== NEXUS - Version finale corrigée ===== */
  :root{
    --bg: #fcfbf8;
    --text: #181815;
    --border: #e8e2d6;
    --surface: #ffffff;
    --mustard: #c9a86a;
  }
  [data-theme="night"]{
    --bg: #0f0f0e;
    --text: #eceae5;
    --border: #2a2a28;
    --surface: #1a1a18;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-system, -apple-system, Inter, system-ui, sans-serif;
    height:100%;
  }
  body{
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  /* Header sobre */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background: var(--bg);
    z-index:10;
  }
  header h1{
    margin:0;
    font-family: Georgia, serif;
    font-weight:400;
    letter-spacing:0.18em;
    font-size:15px;
  }
  #toggle{
    border:1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius:999px;
    padding:6px 14px;
    font-size:12px;
    letter-spacing:0.06em;
    cursor:pointer;
  }
  /* Zone de chat */
  #chat{
    flex:1;
    overflow-y:auto;
    padding:28px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:14px;
    width:100%;
    max-width:760px;
    margin:0 auto;
  }
  .bubble{
    max-width:78%;
    padding:12px 16px;
    border-radius:18px;
    line-height:1.55;
    font-size:15px;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .bubble.user{
    align-self:flex-end;
    background: #c9a86a; /* bulle utilisateur moutarde */
    color:#1a1a1a;
    border-bottom-right-radius:5px;
  }
  .bubble.nexus{
    align-self:flex-start;
    background: var(--surface);
    border:1px solid var(--border); /* bord subtil */
    border-bottom-left-radius:5px;
  }
  .bubble .label{
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    opacity:0.5;
    margin-bottom:5px;
  }
  .bubble.debug{
    align-self:center;
    background:#fff8e1;
    border:1px dashed #c9a86a;
    color:#6b5a2f;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:12.5px;
    max-width:92%;

    background:#1e1b13;
    color:#d6c49a;
  }

  #input-bar{
    display:flex;
    gap:10px;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));

    background: var(--bg);
    width:100%;
    max-width:760px;
    margin:0 auto;
  }
  #input-bar input{
    flex:1;
    border:1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius:999px;
    padding:12px 18px;
    font-size:15px;
    outline:none;
  }
  #input-bar input:focus{
    border-color:#c9a86a;
  }
  #input-bar button{
    border:none;
    background:#1a1a1a;
    color:#fcfbf8;
    border-radius:999px;
    padding:12px 20px;
    font-size:13px;
    letter-spacing:0.06em;
    cursor:pointer;
  }
  [data-theme="night"] #input-bar button{
    background:#eceae5;
    color:#0f0f0e;
  }

<body data-theme="day">
<header>
  <h1>NEXUS</h1>
  <button id="toggle" aria-label="Changer jour/nuit">NIGHT • ○</button>
</header>

<main id="chat" aria-live="polite"></main>

<form id="input-bar">
  <input id="text" type="text" placeholder="Écris un message… ex: météo Paris" autocomplete="off" />
  <button type="submit">ENVOYER</button>
</form>

<script type="module">
  // NEXUS - logique finale, lisible pour débutant
  // Pas de REGISTRE hard-codé, tout vient de dictionaries.json et pions/*.js

  import { init, parse } from './nexus.js';

  // 1. Charger le dictionnaire
  let dict = null;
  try{
    const res = await fetch('./dictionaries.json');
    if(!res.ok) throw new Error('dictionaries.json not found - status ' + res.status);
    dict = await res.json();
    init(dict); // Initialise NEXUS avec le dictionnaire
    console.log('NEXUS dict chargé', Object.keys(dict));
  }catch(e){
    console.error('Erreur dictionaries.json', e);
    addBubble("Erreur: dictionaries.json introuvable à la racine. Vérifie que le fichier existe et que le fetch est autorisé (http, pas file://).", "nexus", "SYSTEM");
  }

  // 2. Charger un pion dynamiquement
  async function getPion(name){
    try{
      // import dynamique - le nom vient du plan renvoyé par parse()
      const mod = await import(\`./pions/\${name}.js\`);
      if(!mod.execute){
        throw new Error('execute() manquant dans ' + name);
      }
      return mod;
    }catch(e){
      console.error(\`Pion ./pions/\${name}.js introuvable\`, e);
      // Fallback vers generic si possible
      try{
        const fallback = await import('./pions/generic.js');
        return fallback;
      }catch(e2){
        console.error('Pion generic aussi introuvable', e2);
        return {
          execute: async () => ({ text: "Erreur: dossier ./pions/ manquant ou fichier " + name + ".js introuvable. Vérifie la structure sur GitHub." })
        };
      }
    }
  }

  const chat = document.getElementById('chat');
  const form = document.getElementById('input-bar');
  const input = document.getElementById('text');
  const toggle = document.getElementById('toggle');

  function addBubble(text, type, label){
    const div = document.createElement('div');
    div.className = 'bubble ' + type;
    if(type === 'debug'){
      div.textContent = text;
    }else{
      if(label){
        const l = document.createElement('div');
        l.className = 'label';
        l.textContent = label;
        div.appendChild(l);
      }
      const span = document.createElement('div');
      span.textContent = text;
      div.appendChild(span);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  // 3. Toggle jour/nuit sobre
  toggle.addEventListener('click', ()=>{
    const current = document.body.getAttribute('data-theme');
    const next = current === 'day' ? 'night' : 'day';
    document.body.setAttribute('data-theme', next);
    toggle.textContent = next === 'day' ? 'NIGHT • ○' : 'DAY • ●';
  });

  // 4. Logique de chat
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;

    // Bulle utilisateur moutarde
    addBubble(text, 'user');
    input.value = '';

    // Parser via NEXUS
    let plan = [];
    try{
      plan = parse({ text });
      console.log('NEXUS plan', plan);
    }catch(err){
      console.error('parse() a échoué', err);
      addBubble("Debug: parse() a planté - " + err.message, 'debug');
      return;
    }

    // Cas bug générique
    const isEmpty = !plan || plan.length === 0;
    const isOnlyGeneric = plan.length === 1 && plan[0].pion === 'generic';
    if(isEmpty || isOnlyGeneric){
      addBubble("Debug: NEXUS a renvoyé generic, vérifie dictionaries.json et pions/*.js - plan: " + JSON.stringify(plan), 'debug');
      return;
    }

    // Exécuter chaque tâche du plan
    for(const task of plan){
      const mod = await getPion(task.pion);
      try{
        const res = await mod.execute(task.params);
        // label = pion + ville si dispo
        const city = task.params?.city || task.params?.ville || '';
        const label = city ? task.pion + ' • ' + city : task.pion;
        addBubble(res.text, 'nexus', label);
      }catch(err){
        console.error('execute() échoué pour', task.pion, err);
        addBubble("Erreur dans le pion " + task.pion + ": " + err.message, 'debug');
      }
    }
  });

  // Message d'accueil minimal, pas de mock
  addBubble("Prêt. Tape une ville ou une demande.", "nexus", "NEXUS");
<\/script>
</body>
