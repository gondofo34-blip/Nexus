<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXUS</title>
<style>
  :root{ --bg:#fcfbf8; --text:#181815; --border:#e8e2d6; --surface:#fff; --mustard:#c9a86a; }
  [data-theme="night"]{ --bg:#0f0f0e; --text:#eceae5; --border:#2a2a28; --surface:#1a1a18; }
  *{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;height:100%}
  body{display:flex;flex-direction:column;min-height:100vh}
  header{display:flex;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
  header h1{margin:0;font-family:Georgia,serif;letter-spacing:.18em;font-size:15px;font-weight:400}
  #toggle{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:12px;cursor:pointer}
  #chat{flex:1;overflow-y:auto;padding:28px 20px;display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto;width:100%}
  .bubble{max-width:78%;padding:12px 16px;border-radius:18px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word}
  .bubble.user{align-self:flex-end;background:#c9a86a;color:#1a1a1a;border-bottom-right-radius:5px}
  .bubble.nexus{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px}
  .bubble .label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.5;margin-bottom:5px}
  #input-bar{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border);max-width:760px;margin:0 auto;width:100%}
  #input-bar input{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:12px 18px;outline:none}
  #input-bar button{border:none;background:#1a1a1a;color:#fcfbf8;border-radius:999px;padding:12px 20px;cursor:pointer}
</style>
</head>
<body data-theme="day">
<header><h1>NEXUS</h1><button id="toggle">NIGHT • ○</button></header>
<main id="chat"></main>
<form id="input-bar"><input id="text" placeholder="météo Paris, météo Tokyo..." autocomplete="off"/><button>ENVOYER</button></form>

<script type="module">
import { init, parse } from './nexus.js';
let dict = null;
try{
  const res = await fetch('./dictionaries.json');
  dict = await res.json();
  init(dict);
  console.log('[NEXUS] dict ok', dict);
}catch(e){ console.error(e); }

async function getPion(name){
  // Si tu as renommé en meteo.js, on force meteo
  const fileName = name === 'weather' ? 'meteo' : name;
  try{
    const mod = await import(`./pions/${fileName}.js?v=${Date.now()}`);
    return mod;
  }catch(e){
    console.error(`Pion ./pions/${fileName}.js introuvable`, e);
    return { execute: async()=>({text:`Pion ${fileName}.js manquant`}) };
  }
}

const chat = document.getElementById('chat');
const form = document.getElementById('input-bar');
const input = document.getElementById('text');

function addBubble(text,type,label){
  const div=document.createElement('div'); div.className='bubble '+type;
  if(label){ const l=document.createElement('div'); l.className='label'; l.textContent=label; div.appendChild(l); }
  const s=document.createElement('div'); s.textContent=text; div.appendChild(s);
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}

document.getElementById('toggle').onclick=()=>{
  const cur=document.body.getAttribute('data-theme');
  const next=cur==='day'?'night':'day';
  document.body.setAttribute('data-theme',next);
};

form.onsubmit=async(e)=>{
  e.preventDefault();
  const text=input.value.trim(); if(!text) return;
  addBubble(text,'user'); input.value='';
  const plan=parse({text});
  console.log('[NEXUS] plan', plan);
  for(const task of plan){
    const mod=await getPion(task.pion);
    const res=await mod.execute(task.params);
    addBubble(res.text,'nexus', (task.pion+' • '+(task.params.city||'')));
  }
};
addBubble("Prêt. Tape météo Paris / météo Tokyo","nexus","NEXUS");
</script>
</body>
</html>
